project = "2084"
goal = "docs/plans/first-consequential-choice/GOAL.md"
skill = ".agents/skills/goal-development/SKILL.md"
context = ["docs/plans/CURRENT.md", "docs/main/DEVELOPMENT_LOOP.md", ".agents/skills/goal-development/references/2084.md"]

[window]
timezone = "America/Toronto"
start = "18:00"
end = "23:00"
checkpoint_seconds = 120

[agent]
command = ["codex"]
model = "gpt-5.6-terra"
review_model = "gpt-5.6-sol"
reasoning = "high"
sandbox = "workspace-write"
network_access = true

[limits]
turn_seconds = 2700
failed_attempts = 3
retry_seconds = 30

[validation]
commands = [
  ["{python}", "-m", "unittest", "discover", "-s", "tests", "-p", "test_*.py"],
  ["git", "diff", "--check"],
  ["git", "diff", "--cached", "--check"],
]

[review]
paths = [
  "simulation/world.py", "simulation/engine.py", "simulation/actions.py",
  "simulation/events.py", "simulation/official_record.py", "simulation/understanding.py",
  "simulation/day_runtime.py", "policies/model_focal_policy.py", "policies/mara_*.py",
  "policies/ollama_client.py", "scenarios/autonomous_day_audit.py",
  "devloop/**", "scripts/**", ".agents/**", "AGENTS.md", "development-loop.toml",
  "docs/main/ARCHITECTURE.md", "docs/plans/*/GOAL.md",
]
test_paths = ["tests/**"]

[environment]
# The Mac runs development; the Windows PC serves only the simulation's Qwen model.
# This is the last verified LAN address; an environment value overrides it.
OLLAMA_BASE_URL = "http://10.0.0.160:11434"
OLLAMA_MODEL = "qwen3:4b-instruct"
